<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Investment Daily Dashboard</title>
<script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f4f6fa;font-family:'Malgun Gothic',Arial,sans-serif;font-size:13px}
.wrap{padding:8px;max-width:1400px;margin:0 auto}
.header{text-align:center;padding:12px 0 8px}
.header h2{font-size:28px;font-weight:800;text-decoration:underline;text-underline-offset:4px}
.header .date{font-size:12px;color:#888;margin-top:3px}
.ai-box{background:#f0f7ff;border-left:4px solid #1d4ed8;border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:12px;line-height:1.7;color:#1e3a5f}
.ai-label{font-size:14px;font-weight:700;color:#1d4ed8;margin-bottom:4px}
.top{display:grid;gap:8px;margin-bottom:8px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:768px){.top{grid-template-columns:1.3fr 1fr}}
@media(max-width:767px){.top{grid-template-columns:1fr}.grid4{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.grid4{grid-template-columns:1fr}.header h2{font-size:20px}}
.card{background:#fff;border-radius:10px;padding:8px;box-shadow:0 1px 4px rgba(0,0,0,.06);min-width:0}
.card-title{font-weight:700;font-size:14px;color:#1d1d1f}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.card-tabs{display:flex;gap:4px;margin-bottom:5px}
.card-tab{background:transparent;border:1px solid #e0e0e0;border-radius:10px;font-size:10px;font-weight:700;color:#888;padding:2px 8px;cursor:pointer;font-family:inherit}
.card-tab.on{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
.cptabs{display:flex;gap:2px;flex-shrink:0}
.cptab{background:none;border:1px solid #e8e8e8;border-radius:5px;font-size:9px;font-weight:700;color:#bbb;padding:2px 5px;cursor:pointer;font-family:inherit}
.cptab.on{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
.chart-box{height:80px;margin:3px 0;position:relative;overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;font-size:11px;padding:3px 2px;border-bottom:1px solid #f4f4f4;cursor:pointer;border-radius:3px;transition:background 0.1s}
.row:last-child{border-bottom:none}
.row:hover{background:#f0f4ff}
.rn{font-weight:600;color:#1d4ed8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.up{color:#c84a31}.down{color:#1261c4}.flat{color:#888}
.ntab{background:transparent;border:1px solid #e0e0e0;border-radius:12px;font-size:10px;font-weight:700;color:#888;padding:3px 10px;cursor:pointer;font-family:inherit}
.ntab.on{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
.ni{padding:7px 0;border-bottom:1px solid #f4f4f4}
.ni:last-child{border-bottom:none}
.ni-top{display:flex;align-items:center;gap:4px;margin-bottom:3px}
.ns{font-size:10px;color:#1d4ed8;font-weight:700}
.nbadge{font-size:9px;font-weight:700;padding:1px 6px;border-radius:6px;color:#fff}
.nbadge.속보{background:#e53e3e}
.nbadge.분석{background:#2b6cb0}
.nbadge.국내{background:#276749}
.nt{font-size:12px;line-height:1.4;color:#111;cursor:pointer}
.nt:hover{color:#1d4ed8}
.sec{background:#fff;border-radius:10px;padding:10px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.sec-title{font-weight:700;font-size:15px;margin-bottom:8px;color:#1d1d1f}
.sec-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.scroll-x{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}
.chip{background:#f0f4ff;color:#1d4ed8;border:none;border-radius:14px;padding:4px 12px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit}
.chip.on{background:#1d4ed8;color:#fff}
.etf-grid{display:grid;gap:6px;margin-bottom:4px}
.etfc{background:#f8fafc;border:1px solid #e8edf5;border-radius:8px;padding:8px 10px;min-width:0;cursor:pointer;transition:background 0.1s;display:grid;grid-template-columns:1fr auto;gap:4px;align-items:center}
.etfc:hover{background:#eef3fc}
.etfc-info{min-width:0}
.etfn{font-size:10px;font-weight:700;color:#1d4ed8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.etfp{font-size:14px;font-weight:800;color:#111;margin-top:1px}
.etfch{font-size:11px;font-weight:600;margin-top:1px}
.etf-spark{height:44px;width:90px;flex-shrink:0}
.tw{overflow-x:auto;margin-top:6px}
.stock-scroll{max-height:300px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:11px}
th{background:#f8fafc;color:#888;font-weight:700;padding:6px 4px;text-align:right;border-bottom:1px solid #eee;white-space:nowrap;position:sticky;top:0;z-index:1}
th:first-child{text-align:left}
td{padding:5px 4px;text-align:right;border-bottom:1px solid #f4f4f4;white-space:nowrap;color:#222}
td:first-child{text-align:left;font-weight:700;cursor:pointer;color:#1d4ed8}
td:first-child:hover{text-decoration:underline}
tr:hover td{background:#f8fafc}
.overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:99}
.overlay.show{display:block}
.detail-panel{display:none;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:66%;min-width:320px;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.15);padding:16px;z-index:100;max-height:80vh;overflow-y:auto}
.detail-panel.show{display:block}
@media(max-width:767px){.detail-panel{width:100%}}
.detail-close{float:right;background:none;border:none;font-size:22px;cursor:pointer;color:#888;line-height:1}
.detail-name{font-size:18px;font-weight:800;margin-bottom:2px}
.detail-price{font-size:26px;font-weight:800;margin:6px 0}
.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.detail-item{background:#f8fafc;border-radius:8px;padding:8px;text-align:center}
.detail-item .dl{font-size:10px;color:#888;margin-bottom:3px}
.detail-item .dv{font-size:12px;font-weight:700}
.detail-chart-wrap{height:220px;margin:8px 0}
.detail-tabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.detail-tab{background:transparent;border:1px solid #e0e0e0;border-radius:8px;font-size:10px;font-weight:700;color:#888;padding:4px 10px;cursor:pointer;font-family:inherit}
.detail-tab.on{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
.period-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.ps-item{background:#f8fafc;border-radius:8px;padding:8px;text-align:center}
.ps-item .pl{font-size:10px;color:#888;margin-bottom:3px}
.ps-item .pv{font-size:13px;font-weight:700}
.updated{text-align:center;font-size:10px;color:#bbb;padding:8px 0 16px}
.no-data{text-align:center;color:#bbb;font-size:12px;padding:12px}
.pf-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
@media(max-width:480px){.pf-summary{grid-template-columns:repeat(2,1fr)}}
.pf-si{background:#f8fafc;border-radius:8px;padding:10px;text-align:center}
.pf-sl{font-size:10px;color:#888;margin-bottom:4px}
.pf-sv{font-size:15px;font-weight:800;color:#111}
.pf-sv.up{color:#c84a31}.pf-sv.down{color:#1261c4}
.pftable td:first-child{color:#222;cursor:default}
.pftable td:first-child:hover{text-decoration:none}
.pf-editor{display:none;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:66%;min-width:320px;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.18);padding:16px;z-index:101;max-height:85vh;overflow-y:auto}
.pf-editor.show{display:block}
@media(max-width:767px){.pf-editor{width:100%}}
.pf-edit-table{width:100%;border-collapse:collapse;font-size:12px}
.pf-edit-table th{background:#f8fafc;color:#888;font-weight:700;padding:6px 4px;text-align:left;border-bottom:1px solid #eee;white-space:nowrap}
.pf-edit-table td{padding:3px 2px;vertical-align:middle}
.pf-edit-input{width:100%;border:1px solid #e0e0e0;border-radius:6px;padding:4px 6px;font-size:12px;font-family:inherit;box-sizing:border-box}
.pf-edit-select{width:100%;border:1px solid #e0e0e0;border-radius:6px;padding:4px 6px;font-size:12px;font-family:inherit}
.mkt-badge{display:inline-flex;align-items:center;font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;margin-right:3px;vertical-align:middle}
.mkt-kr{background:#e8f5e9;color:#2e7d32}.mkt-us{background:#e3f2fd;color:#1565c0}.mkt-etc{background:#f5f5f5;color:#666}
.lock-tag{font-size:11px;color:#f59e0b;margin-left:2px;vertical-align:middle;cursor:help}
.pf-donut-wrap{display:flex;gap:14px;align-items:flex-start;margin-bottom:10px;flex-wrap:wrap}
.pf-legend{display:flex;flex-direction:column;gap:4px;flex:1;min-width:120px;max-height:130px;overflow-y:auto}
.pf-legend-item{display:flex;align-items:center;gap:6px;font-size:10px;white-space:nowrap;overflow:hidden}
.pf-legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.autocomplete-list{position:fixed;background:#fff;border:1px solid #e0e0e0;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.14);z-index:600;max-height:210px;overflow-y:auto;min-width:200px}
.ac-item{padding:7px 10px;font-size:11px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid #f4f4f4}
.ac-item:last-child{border-bottom:none}
.ac-item:hover{background:#f0f4ff}
.ac-item-sym{font-size:9px;color:#999;font-weight:700;white-space:nowrap}
.pf-pct{font-size:10px;white-space:nowrap}
.pf-pct.up{color:#c84a31}.pf-pct.down{color:#1261c4}.pf-pct.flat{color:#ccc}
.pf-tabs{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.pf-tab{background:transparent;border:1px solid #e0e0e0;border-radius:10px;font-size:11px;font-weight:700;color:#888;padding:3px 12px;cursor:pointer;font-family:inherit}
.pf-tab.on{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
.pf-content{display:none}
.pf-content.on{display:block}
.cash-item{display:flex;justify-content:space-between;align-items:center;padding:8px 4px;border-bottom:1px solid #f4f4f4;font-size:12px}
.cash-item:last-child{border-bottom:none}
.cash-bank{display:flex;align-items:center;gap:6px;font-weight:700;color:#1d1d1f}
.cash-bank-icon{width:24px;height:24px;border-radius:6px;background:#e3f2fd;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.cash-amt{font-weight:700;color:#1d1d1f;font-size:13px}
.cash-total-row{display:flex;justify-content:space-between;align-items:center;padding:8px 4px;border-top:2px solid #e8edf5;margin-top:4px;font-weight:700;font-size:12px}
.sav-card{background:#f8fafc;border:1px solid #e8edf5;border-radius:10px;padding:12px;margin-bottom:8px}
.sav-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sav-type{font-size:10px;font-weight:700;padding:2px 8px;border-radius:5px;background:#e3f2fd;color:#1565c0}
.sav-bank{font-size:14px;font-weight:800;color:#1d1d1f}
.sav-dday{font-size:10px;font-weight:700;padding:2px 8px;border-radius:5px;background:#f0fdf4;color:#16a34a;margin-left:auto}
.sav-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sav-item .sl{font-size:10px;color:#888;margin-bottom:2px}
.sav-item .sv{font-size:13px;font-weight:700;color:#1d1d1f}
.sav-rate{color:#059669}
.pf-realized{display:flex;align-items:center;gap:6px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:8px 12px;margin-top:8px;font-size:11px;color:#16a34a;font-weight:700}
.pfe-tabs{display:flex;gap:4px;margin-bottom:12px}
.pfe-tab{background:transparent;border:1px solid #e0e0e0;border-radius:8px;font-size:11px;font-weight:700;color:#888;padding:4px 12px;cursor:pointer;font-family:inherit;flex:1;text-align:center}
.pfe-tab.on{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
.pfe-content{display:none}
.pfe-content.on{display:block}
</style>
</head>
<body>
<div class="wrap">
<div class="header">
  <h2>Investment Daily Dashboard</h2>
  <div class="date" id="header-date"></div>
</div>
<div class="ai-box">
  <div class="ai-label">🤖 AI 시황 코멘트</div>
  <div id="ai-comment">로딩 중...</div>
</div>
<div class="top">
  <div class="grid4">
    <!-- 주식 카드 -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">주식</div>
        <div class="cptabs" id="cp-cb1"></div>
      </div>
      <div class="card-tabs">
        <button class="card-tab on" onclick="switchStockTab('kr',this)">🇰🇷 한국</button>
        <button class="card-tab" onclick="switchStockTab('us',this)">🇺🇸 미국</button>
      </div>
      <div class="chart-box" id="cb1"></div>
      <div id="m1"></div>
    </div>
    <!-- 지수 카드 -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">지수</div>
        <div class="cptabs" id="cp-cb2"></div>
      </div>
      <div class="chart-box" id="cb2"></div>
      <div id="m2"></div>
    </div>
    <!-- 외환 카드 -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">외환</div>
        <div class="cptabs" id="cp-cb3"></div>
      </div>
      <div class="chart-box" id="cb3"></div>
      <div id="m3"></div>
    </div>
    <!-- 원자재 카드 -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">원자재</div>
        <div class="cptabs" id="cp-cb4"></div>
      </div>
      <div class="chart-box" id="cb4"></div>
      <div id="m4"></div>
    </div>
  </div>
  <!-- 뉴스 -->
  <div class="card">
    <div class="card-title" style="margin-bottom:8px">📰 뉴스</div>
    <div style="display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap">
      <button class="ntab on" onclick="filterNews('all',this)">전체</button>
      <button class="ntab" onclick="filterNews('속보',this)">⚡속보</button>
      <button class="ntab" onclick="filterNews('분석',this)">📊분석</button>
      <button class="ntab" onclick="filterNews('국내',this)">🇰🇷국내</button>
    </div>
    <div id="news"><div class="no-data">로딩 중...</div></div>
  </div>
</div>

<!-- 주식 시세 -->
<div class="sec">
  <div class="sec-title">📊 주식 시세</div>
  <div class="scroll-x" id="themes"></div>
  <div class="tw">
    <div class="stock-scroll">
      <table>
        <thead><tr>
          <th>종목</th><th>현재가</th><th>전일비</th><th>등락률</th><th>거래량</th><th>고가</th><th>저가</th>
        </tr></thead>
        <tbody id="stb"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- ETF -->
<div class="sec">
  <div class="sec-header">
    <div class="sec-title" style="margin:0">📦 주요 ETF</div>
    <div class="cptabs" id="cp-etf"></div>
  </div>
  <div class="etf-grid" id="etf-grid"></div>
</div>

<!-- 포트폴리오 -->
<div class="sec" id="pf-sec">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
    <div style="font-weight:700;font-size:15px;color:#1d1d1f">💼 내 포트폴리오</div>
    <button onclick="openPfEditor()" style="background:#f0f4ff;color:#1d4ed8;border:1px solid #c7d7fb;border-radius:8px;padding:4px 12px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">주식 편집</button>
  </div>
  <!-- KPI 요약 -->
  <div class="pf-summary" id="pf-summary"></div>
  <!-- 자산배분 도넛 -->
  <div id="pf-chart-wrap" style="margin-bottom:10px"></div>
  <!-- 탭 -->
  <div class="pf-tabs">
    <button class="pf-tab on" onclick="switchPfTab('stock',this)">📈 주식</button>
    <button class="pf-tab" onclick="switchPfTab('cash',this)">🏦 현금</button>
    <button class="pf-tab" onclick="switchPfTab('savings',this)">💰 예적금</button>
  </div>
  <!-- 주식 탭 -->
  <div class="pf-content on" id="pf-stock-tab">
    <div class="tw">
      <table class="pftable">
        <thead><tr>
          <th>종목</th><th>수량</th><th>평단가</th><th>현재가</th><th>전일비</th><th>1달비</th><th>6달비</th><th>1년비</th><th>평가금액</th><th>수익률/손익</th>
        </tr></thead>
        <tbody id="pftb"></tbody>
      </table>
    </div>
    <div id="pf-realized-wrap"></div>
  </div>
  <!-- 현금 탭 -->
  <div class="pf-content" id="pf-cash-tab">
    <div id="pf-cash-list"></div>
  </div>
  <!-- 예적금 탭 -->
  <div class="pf-content" id="pf-savings-tab">
    <div id="pf-savings-list"></div>
  </div>
</div>
<div class="updated" id="upd"></div>
</div>

<!-- 상세 팝업 -->
<div class="overlay" id="overlay" onclick="closeDetail()"></div>
<div class="detail-panel" id="detail-panel">
  <button class="detail-close" onclick="closeDetail()">✕</button>
  <div class="detail-name" id="d-name"></div>
  <div class="detail-price" id="d-price"></div>
  <div class="detail-grid" id="d-grid"></div>
  <div class="detail-tabs">
    <button class="detail-tab on" onclick="detailTab('1d','5m',this)">1일</button>
    <button class="detail-tab" onclick="detailTab('5d','1h',this)">1주</button>
    <button class="detail-tab" onclick="detailTab('1mo','1d',this)">1달</button>
    <button class="detail-tab" onclick="detailTab('3mo','1wk',this)">3달</button>
    <button class="detail-tab" onclick="detailTab('6mo','1wk',this)">6달</button>
    <button class="detail-tab" onclick="detailTab('1y','1mo',this)">1년</button>
    <button class="detail-tab" onclick="detailTab('5y','1mo',this)">5년</button>
    <button class="detail-tab" onclick="detailTab('max','1mo',this)">최대</button>
  </div>
  <div class="detail-chart-wrap" id="detail-chart-wrap"></div>
  <div class="period-summary" id="period-summary"></div>
  <div style="text-align:center;margin-top:10px">
    <a id="naver-link" href="#" target="_blank" style="font-size:12px;color:#1d4ed8;font-weight:700">네이버 증권에서 보기 →</a>
  </div>
</div>

<!-- 포트폴리오 편집 팝업 -->
<div class="overlay" id="pf-overlay" onclick="closePfEditor()"></div>
<div class="pf-editor" id="pf-editor">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <div style="font-size:16px;font-weight:800">💼 포트폴리오 편집</div>
    <button onclick="closePfEditor()" style="background:none;border:none;font-size:22px;cursor:pointer;color:#888;line-height:1">✕</button>
  </div>
  <!-- 편집 탭 -->
  <div class="pfe-tabs">
    <button class="pfe-tab on" onclick="switchEditorTab('stock',this)">📈 주식</button>
    <button class="pfe-tab" onclick="switchEditorTab('cash',this)">🏦 현금</button>
    <button class="pfe-tab" onclick="switchEditorTab('savings',this)">💰 예적금</button>
  </div>

  <!-- 주식 편집 -->
  <div class="pfe-content on" id="pfe-stock">
    <div style="overflow-x:auto">
      <table class="pf-edit-table">
        <thead><tr>

function calcPeriodChg(curPrice,closes,ts){
  if(!closes?.length||!ts?.length)return{d1:null,mo1:null,mo6:null,y1:null};
  const valid=ts.map((t,i)=>closes[i]!=null?{t,v:closes[i]}:null).filter(Boolean);
  if(valid.length<2)return{d1:null,mo1:null,mo6:null,y1:null};
  const now=valid[valid.length-1].t;
  const find=days=>{const target=now-days*86400;let b=null,bd=Infinity;valid.forEach(p=>{const d=Math.abs(p.t-target);if(d<bd){bd=d;b=p.v;}});return b;};
  const prev1d=valid[valid.length-2].v;
  const pct=base=>base&&curPrice?((curPrice-base)/base*100):null;
  return{d1:pct(prev1d),mo1:pct(find(30)),mo6:pct(find(180)),y1:pct(find(365))};
}

function drawDonutChartData(el,data,centerLabel){
  if(!data?.length){el.innerHTML='';return;}
  const total=data.reduce((s,d)=>s+(d.v||0),0);
  if(!total){el.innerHTML='';return;}
  const withPct=data.filter(d=>d.v>0).map((d,i)=>({...d,pct:d.v/total*100,color:d.color||PF_COLORS[i%PF_COLORS.length]}));
  const r=48,cx=60,cy=60,sw=18;
  let cA=-Math.PI/2;
  const arcs=withPct.map(d=>{
    const a=d.v/total*2*Math.PI;
    const x1=cx+r*Math.cos(cA),y1=cy+r*Math.sin(cA);
    const na=cA+a,x2=cx+r*Math.cos(na),y2=cy+r*Math.sin(na);
    const arc=`<path d="M${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${a>Math.PI?1:0},1 ${x2.toFixed(2)},${y2.toFixed(2)}" fill="none" stroke="${d.color}" stroke-width="${sw}" stroke-linecap="butt"/>`;
    cA=na;return arc;
  });
  const lbl=centerLabel||`${withPct.length}개`;
  const svg=`<svg width="120" height="120" viewBox="0 0 120 120">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#f0f0f0" stroke-width="${sw}"/>
    ${arcs.join('')}
    <text x="${cx}" y="${cy-5}" text-anchor="middle" font-size="11" font-weight="700" fill="#1d1d1f" font-family="'Malgun Gothic',Arial,sans-serif">${lbl}</text>
    <text x="${cx}" y="${cy+9}" text-anchor="middle" font-size="9" fill="#888" font-family="'Malgun Gothic',Arial,sans-serif">포트폴리오</text>
  </svg>`;
  const legend=withPct.map(d=>`<div class="pf-legend-item"><div class="pf-legend-dot" style="background:${d.color}"></div><span style="flex:1;overflow:hidden;text-overflow:ellipsis">${d.n}</span><span style="color:#888;flex-shrink:0;margin-left:4px">${d.pct.toFixed(1)}%</span></div>`).join('');
  el.innerHTML=`<div class="pf-donut-wrap"><div style="flex-shrink:0">${svg}</div><div class="pf-legend">${legend}</div></div>`;
}

async function yfetch(symbol,interval,range){
  const base='https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(symbol)+'?interval='+interval+'&range='+range;
  for(const pf of PROXY){
    try{
      const r=await fetch(pf(base),{signal:AbortSignal.timeout(10000)});
      if(!r.ok)continue;
      const j=await r.json();
      if(j?.chart?.result?.[0])return j;
    }catch(e){}
  }
  return null;
}

function drawSparkSVG(el,values,isUp,h){
  const w=el.clientWidth||200;h=h||80;
  const color=isUp?NAVER.up:NAVER.down;
  const mn=Math.min(...values),mx=Math.max(...values);
  const rng=mx-mn||mx*0.02||1;
  const px=2,py=4;
  const pts=values.map((v,i)=>[px+(i/(values.length-1))*(w-px*2),py+(1-(v-mn)/rng)*(h-py*2)]);
  let line=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=1;i<pts.length;i++){
    const cx=(pts[i-1][0]+pts[i][0])/2;
    line+=` C${cx},${pts[i-1][1]} ${cx},${pts[i][1]} ${pts[i][0]},${pts[i][1]}`;
  }
  const fill=line+` L${pts[pts.length-1][0]},${h} L${pts[0][0]},${h} Z`;
  const gid='sg'+Math.random().toString(36).slice(2);
  el.innerHTML=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${fill}" fill="url(#${gid})"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

  }
}

async function makeMiniChart(cbId,candles,isUp,symbol){
  const el=document.getElementById(cbId);
  if(!el)return;
  el.innerHTML='';
  let vals=[];
  if(symbol){
    const data=await yfetch(symbol,'5m','1d');
    if(data?.chart?.result?.[0]){
      const q=data.chart.result[0].indicators.quote[0];
      vals=(q.close||[]).filter(v=>v!=null);
    }
  }
  if(vals.length<2&&candles){
    vals=[...candles].sort((a,b)=>a.time-b.time).map(c=>c.close).filter(v=>v!=null);
  }
  if(vals.length<2)return;
  cardState[cbId]={...(cardState[cbId]||{}),currentVals:vals};
  drawSparkSVG(el,vals,isUp,80);
  new ResizeObserver(()=>{if(el.clientWidth>0){el.innerHTML='';drawSparkSVG(el,vals,isUp,80);}}).observe(el);
}

    setTimeout(()=>makeMiniChart(cbId,m?.candles||[],isUp,sym),50);
  }
}

async function loadStockTable(theme){
  const tbody=document.getElementById('stb');
  tbody.innerHTML='<tr><td colspan="7" style="text-align:center;color:#bbb;padding:10px">로딩 중...</td></tr>';
  if(theme==='실시간▲상승'||theme==='실시간▼하락'){
    if(!kr50Cache.length){tbody.innerHTML='<tr><td colspan="7" style="text-align:center;color:#bbb;padding:10px">한국주요50 탭을 먼저 눌러주세요</td></tr>';return;}
    const sorted=[...kr50Cache].sort((a,b)=>theme==='실시간▲상승'?b.pct-a.pct:a.pct-b.pct);
    renderTableRows(sorted.slice(0,20));return;
  }
  if(theme==='한국주요50'){
    // Show cached data.json data immediately
    const fromJson=['samsung','hynix','hanwha','hyundai','naver'].map(k=>{
      const m=jsonData?.market?.[k];if(!m)return null;
      const names={samsung:'삼성전자',hynix:'SK하이닉스',hanwha:'한화에어로',hyundai:'현대차',naver:'NAVER'};
      const syms={samsung:'005930.KS',hynix:'000660.KS',hanwha:'012450.KS',hyundai:'005380.KS',naver:'035420.KS'};
      return{n:names[k],s:syms[k],p:m.price,c:m.change,pct:m.pct,vol:m.vol,h:m.high,l:m.low};
    }).filter(Boolean);
    if(fromJson.length)renderTableRows(fromJson);
    if(kr50Cache.length){renderTableRows(kr50Cache);return;}
    // Fetch remaining in background
    const results=await Promise.all(KR50.map(s=>yfetch(s.s,'1d','5d')));
    kr50Cache=[];
    KR50.forEach((s,i)=>{
      try{
        const meta=results[i].chart.result[0].meta;
        const p=meta.regularMarketPrice,prev=meta.chartPreviousClose||p,c=p-prev;
        kr50Cache.push({n:s.n,s:s.s,p,c,pct:prev?c/prev*100:0,vol:meta.regularMarketVolume||0,h:meta.regularMarketDayHigh||0,l:meta.regularMarketDayLow||0});
      }catch(e){kr50Cache.push({n:s.n,s:s.s,p:0,c:0,pct:0,vol:0,h:0,l:0});}
    });
    renderTableRows(kr50Cache.filter(d=>d.p>0));return;
  }
  const list=THEMES_DEF[theme]||[];
  if(!list.length){tbody.innerHTML='<tr><td colspan="7" style="text-align:center;color:#bbb;padding:10px">데이터 없음</td></tr>';return;}
  const results=await Promise.all(list.map(s=>yfetch(s.s,'1d','5d')));
  renderTableRows(list.map((s,i)=>{
    try{
      const meta=results[i].chart.result[0].meta;
      const p=meta.regularMarketPrice,prev=meta.chartPreviousClose||p,c=p-prev;
      return{n:s.n,s:s.s,p,c,pct:prev?c/prev*100:0,vol:meta.regularMarketVolume||0,h:meta.regularMarketDayHigh||0,l:meta.regularMarketDayLow||0};
    }catch(e){return{n:s.n,s:s.s,p:0,c:0,pct:0,vol:0,h:0,l:0};}
  }).filter(d=>d.p>0));
}

function renderTableRows(rows){
  if(!rows.length){
    document.getElementById('stb').innerHTML='<tr><td colspan="7" style="text-align:center;color:#bbb;padding:10px">데이터를 불러오지 못했습니다</td></tr>';return;
  }
  document.getElementById('stb').innerHTML=rows.map(d=>{
    const c=cls(d.pct);
    const pStr=d.p?d.p.toLocaleString(undefined,{maximumFractionDigits:2}):'-';
    const cStr=d.c?sign(d.c)+(Math.abs(d.c)<1?d.c.toFixed(2):d.c.toFixed(0)):'-';
    return '<tr><td onclick="openDetail(\''+d.n+'\',\''+d.s+'\')">'+d.n+'</td><td>'+pStr+'</td><td class="'+c+'">'+cStr+'</td><td class="'+c+'">'+(d.pct?sign(d.pct)+d.pct.toFixed(2)+'%':'-')+'</td><td>'+(d.vol?(d.vol/1000).toFixed(0)+'K':'-')+'</td><td>'+(d.h?d.h.toLocaleString(undefined,{maximumFractionDigits:0}):'-')+'</td><td>'+(d.l?d.l.toLocaleString(undefined,{maximumFractionDigits:0}):'-')+'</td></tr>';
  }).join('');
}

async function loadETF(interval='5m',range='1d'){
  const grid=document.getElementById('etf-grid');
  grid.style.gridTemplateColumns='repeat('+getEtfCols()+',1fr)';
  grid.innerHTML='';
  // First: show data.json values instantly
  const jsonKeys={SPY:'spy',QQQ:'qqq',EEM:'eem',EFA:'efa',GDX:'gdx',USO:'uso'};
  ETF_LIST.forEach((d,i)=>{
    const jk=jsonKeys[d.s];
    const m=jk&&jsonData?.market?.[jk];
    const price=m?.price||0,chg=m?.change||0;
    const pct=price?(chg/(price-chg)*100):0;
    const c=cls(chg);const isUp=chg>=0;
    const card=document.createElement('div');
    card.className='etfc';card.id='etfc'+i;
    card.onclick=()=>openDetail(d.n,d.s);
    card.innerHTML=`<div class="etfc-info">
      <div class="etfn">${d.n} <span style="color:#999;font-weight:400">${d.s}</span></div>
      <div class="etfp" id="etfp${i}">${price?fmt(price,2):'--'}</div>
      <div class="etfch ${c}" id="etfch${i}">${price?sign(chg)+fmt(chg,2)+' ('+sign(pct)+pct.toFixed(2)+'%)':'--'}</div>
    </div>
    <div class="etf-spark" id="etfs${i}"></div>`;
    grid.appendChild(card);
    // draw sparkline from data.json candles immediately
    if(m?.candles?.length>=2){
      setTimeout(()=>{
        const el=document.getElementById('etfs'+i);if(!el)return;
        const vals=[...m.candles].sort((a,b)=>a.time-b.time).map(c=>c.close).filter(v=>v!=null);
        if(vals.length>=2)drawSparkSVG(el,vals,isUp,44);
      },80);
    }
  });
  window.addEventListener('resize',()=>{grid.style.gridTemplateColumns='repeat('+getEtfCols()+',1fr)';},{once:false});
  // Live fetch to update prices and sparklines
  const results=await Promise.all(ETF_LIST.map(d=>yfetch(d.s,interval,range)));
  ETF_LIST.forEach((d,i)=>{
    if(!results[i])return;
    try{
      const meta=results[i].chart.result[0].meta;
      const price=meta.regularMarketPrice,prev=meta.chartPreviousClose||price;
      const chg=price-prev,pct=prev?chg/prev*100:0;
      const c=cls(chg);const isUp=chg>=0;
      const ep=document.getElementById('etfp'+i);
      const ec=document.getElementById('etfch'+i);
      const es=document.getElementById('etfs'+i);
      if(ep)ep.textContent=fmt(price,2);
      if(ec){ec.className='etfch '+c;ec.textContent=sign(chg)+fmt(chg,2)+' ('+sign(pct)+pct.toFixed(2)+'%)';}
      if(es){
        const q=results[i].chart.result[0].indicators.quote[0];
        const ts=results[i].chart.result[0].timestamp||[];
        const vals=ts.map((_,j)=>q.close[j]).filter(v=>v!=null);
        if(vals.length>=2){drawSparkSVG(es,vals,isUp,44);new ResizeObserver(()=>{if(es.clientWidth>0){es.innerHTML='';drawSparkSVG(es,vals,isUp,44);}}).observe(es);}
      }
    }catch(e){}
  });
}

async function loadDetailChart(symbol,range,interval){
  if(detailChartInst){try{detailChartInst.remove();}catch(e){}detailChartInst=null;}
  const wrap=document.getElementById('detail-chart-wrap');
  wrap.innerHTML='<div style="text-align:center;color:#bbb;padding:40px 0;font-size:12px">로딩 중...</div>';
  document.getElementById('period-summary').innerHTML='';
  const data=await yfetch(symbol,interval,range);
  if(!data){wrap.innerHTML='<div style="text-align:center;color:#bbb;padding:40px 0;font-size:12px">데이터를 불러올 수 없습니다</div>';return;}
  try{
    const meta=data.chart.result[0].meta;
    const q=data.chart.result[0].indicators.quote[0];
    const ts=data.chart.result[0].timestamp||[];
    const closes=q.close||[],opens=q.open||[],highs=q.high||[],lows=q.low||[],vols=q.volume||[];
    const price=meta.regularMarketPrice,prev=meta.chartPreviousClose||price;
    const chg=price-prev,pct=chg/prev*100;
    const c=cls(chg),isUp=chg>=0,color=isUp?NAVER.up:NAVER.down;
    const validIdx=ts.map((_,i)=>i).filter(i=>closes[i]!=null);
    const firstClose=validIdx.length?closes[validIdx[0]]:prev;
    const lastClose=validIdx.length?closes[validIdx[validIdx.length-1]]:price;
    const periodHigh=validIdx.length?Math.max(...validIdx.map(i=>highs[i]||closes[i])):0;
    const periodLow=validIdx.length?Math.min(...validIdx.map(i=>lows[i]||closes[i])):0;
    const periodVol=validIdx.reduce((s,i)=>s+(vols[i]||0),0);
    const periodChg=lastClose-firstClose,periodPct=firstClose?periodChg/firstClose*100:0;

    document.getElementById('d-price').innerHTML=
      '<span>'+price.toLocaleString(undefined,{maximumFractionDigits:2})+'</span>'+
      '<span class="'+c+'" style="font-size:14px;margin-left:8px">'+sign(chg)+chg.toFixed(2)+' ('+sign(pct)+pct.toFixed(2)+'%)</span>';

    const mKey=Object.keys(KEY_TO_YF).find(k=>KEY_TO_YF[k]===symbol);
    const mC=(jsonData?.market?.[mKey]?.candles||[]);
    const lc=mC[mC.length-1]||{};
    const open=meta.regularMarketOpen||lc.open||firstClose||prev;
    const high=meta.regularMarketDayHigh>0?meta.regularMarketDayHigh:(periodHigh>0?periodHigh:lc.high||prev);
    const low=meta.regularMarketDayLow>0?meta.regularMarketDayLow:(periodLow>0?periodLow:lc.low||prev);
    const vol=meta.regularMarketVolume||periodVol||lc.vol||0;

    document.getElementById('d-grid').innerHTML=[
      {l:'시가',v:fmt(open,2)},
      {l:'고가',v:'<span style="color:'+NAVER.up+'">'+fmt(high,2)+'</span>'},
      {l:'저가',v:'<span style="color:'+NAVER.down+'">'+fmt(low,2)+'</span>'},
      {l:'거래량',v:vol?(vol/1000).toFixed(0)+'K':'-'},
      {l:'전일종가',v:fmt(prev,2)},
      {l:'등락률',v:'<span class="'+c+'">'+sign(pct)+pct.toFixed(2)+'%</span>'},
    ].map(x=>'<div class="detail-item"><div class="dl">'+x.l+'</div><div class="dv">'+x.v+'</div></div>').join('');

    wrap.innerHTML='';
    const chart=LightweightCharts.createChart(wrap,{
      width:wrap.clientWidth||320,height:220,
      layout:{background:{color:'#fff'},textColor:NAVER.text,fontSize:10},
      grid:{vertLines:{color:NAVER.grid},horzLines:{color:NAVER.grid}},
      rightPriceScale:{borderVisible:false,scaleMargins:{top:0.1,bottom:0.2}},
      timeScale:{borderVisible:false,timeVisible:true,secondsVisible:false},
      crosshair:{mode:LightweightCharts.CrosshairMode.Normal,
        vertLine:{color:'rgba(0,0,0,0.15)',width:1,style:1,labelBackgroundColor:color},
        horzLine:{color:'rgba(0,0,0,0.15)',width:1,style:1,labelBackgroundColor:color}},
    });
    if(interval==='5m'||interval==='1h'){
      const s=chart.addAreaSeries({lineColor:color,topColor:isUp?NAVER.upBg:NAVER.downBg,bottomColor:'transparent',lineWidth:1.5,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:true,crosshairMarkerRadius:3,crosshairMarkerBorderColor:color,crosshairMarkerBackgroundColor:'#fff'});
      s.setData(ts.map((t,i)=>({time:t,value:closes[i]??null})).filter(d=>d.value!==null).sort((a,b)=>a.time-b.time));
    }else{
      const cs=chart.addCandlestickSeries({upColor:NAVER.up,downColor:NAVER.down,borderUpColor:NAVER.up,borderDownColor:NAVER.down,wickUpColor:NAVER.up,wickDownColor:NAVER.down});
      cs.setData(ts.map((t,i)=>({time:t,open:opens[i]??closes[i],high:highs[i]??closes[i],low:lows[i]??closes[i],close:closes[i]??0})).filter(d=>d.close).sort((a,b)=>a.time-b.time));
      const vs=chart.addHistogramSeries({priceFormat:{type:'volume'},priceScaleId:'vol'});
      chart.priceScale('vol').applyOptions({scaleMargins:{top:0.85,bottom:0}});
      vs.setData(ts.map((t,i)=>({time:t,value:vols[i]||0,color:(closes[i]||0)>=(opens[i]||0)?'rgba(200,74,49,0.25)':'rgba(18,97,196,0.25)'})).filter(d=>d.value).sort((a,b)=>a.time-b.time));
    }
    chart.timeScale().fitContent();
    detailChartInst=chart;
    new ResizeObserver(()=>{if(wrap.clientWidth>0)chart.resize(wrap.clientWidth,220);}).observe(wrap);

    const pc=cls(periodChg);
    document.getElementById('period-summary').innerHTML=[
      {l:'기간 시작가',v:fmt(firstClose,2)},
      {l:'기간 최고가',v:'<span style="color:'+NAVER.up+'">'+fmt(periodHigh,2)+'</span>'},
      {l:'기간 최저가',v:'<span style="color:'+NAVER.down+'">'+fmt(periodLow,2)+'</span>'},
      {l:'기간 변동',v:'<span class="'+pc+'">'+sign(periodChg)+fmt(periodChg,2)+'</span>'},
      {l:'기간 등락률',v:'<span class="'+pc+'">'+sign(periodPct)+periodPct.toFixed(2)+'%</span>'},
      {l:'기간 거래량',v:periodVol?(periodVol/1000).toFixed(0)+'K':'-'},
    ].map(x=>'<div class="ps-item"><div class="pl">'+x.l+'</div><div class="pv">'+x.v+'</div></div>').join('');
  }catch(e){console.log('상세 차트 오류:',e);wrap.innerHTML='<div style="text-align:center;color:#bbb;padding:40px 0">차트 오류</div>';}
}

function fmtPfPrice(price,currency){
  if(currency==='USD')return '$'+price.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
  return '₩'+Math.round(price).toLocaleString();
}
function fmtMan(krw){
  const abs=Math.abs(krw);
  if(abs>=100000000)return (krw/100000000).toFixed(1)+'억';
  return (krw/10000).toFixed(0)+'만';
}

async function renderPortfolio(){
  document.getElementById('pf-sec').style.display='block';
  const usdkrw=jsonData?.market?.usdkrw?.price||1380;

  // 현금: localStorage 우선, 없으면 portfolio.json
  let cashItems;
  try{const s=localStorage.getItem('pf_cash');cashItems=s?JSON.parse(s):null;}catch(e){}
  cashItems=cashItems||pfJson?.cash||[];
  // 예적금: localStorage 우선, 없으면 portfolio.json
  let savingsItems;
  try{const s=localStorage.getItem('pf_savings');savingsItems=s?JSON.parse(s):null;}catch(e){}
  savingsItems=savingsItems||pfJson?.savings||[];
  renderCash(cashItems);
  renderSavings(savingsItems);
  const totalCashKrw=cashItems.reduce((s,c)=>s+(c.currency==='USD'?c.amount*usdkrw:c.amount||0),0);
  const totalSavingsKrw=savingsItems.reduce((s,sv)=>s+(sv.currency==='USD'?sv.maturity_amount*usdkrw:sv.maturity_amount||0),0);

  // Stocks: localStorage first, then portfolio.json, then data.json
  let stocks=null;
  try{const s=localStorage.getItem('pf_holdings');if(s)stocks=JSON.parse(s);}catch(e){}
  if(!stocks?.length&&pfJson?.stocks?.length) stocks=pfJson.stocks;
  if(!stocks?.length&&jsonData?.portfolio?.holdings?.length) stocks=jsonData.portfolio.holdings;

  if(!stocks?.length){
    document.getElementById('pftb').innerHTML='<tr><td colspan="10" style="text-align:center;color:#bbb;padding:16px;font-size:12px">주식 편집 버튼으로 보유 주식을 입력해주세요</td></tr>';
    renderSummaryAndChart(0,0,0,totalCashKrw,totalSavingsKrw);
    return;
  }

  document.getElementById('pftb').innerHTML='<tr><td colspan="10" style="text-align:center;color:#bbb;padding:16px;font-size:12px">실시간 가격 및 기간 수익률 조회 중…</td></tr>';
  const resolved=await Promise.all(stocks.map(async h=>{
    let cur=null,closes=[],timestamps=[];
    const d=await yfetch(h.symbol,'1d','1y');
    if(d?.chart?.result?.[0]){
      const res=d.chart.result[0];
      cur=res.meta.regularMarketPrice;
      closes=res.indicators.quote[0].close||[];
      timestamps=res.timestamp||[];
    }
    if(!cur){const k=Object.keys(KEY_TO_YF).find(k=>KEY_TO_YF[k]===h.symbol);if(k&&jsonData?.market?.[k])cur=jsonData.market[k].price;}
    if(!cur)cur=h.avg_price;
    const periods=calcPeriodChg(cur,closes,timestamps);
    const mkt=h.market||(h.symbol?.includes('.KS')||h.symbol?.includes('.KQ')?'KR':'US');
    const rate=h.currency==='USD'?usdkrw:1;
    const cost_krw=h.avg_price*rate*h.qty,value_krw=cur*rate*h.qty;
    const pnl_krw=value_krw-cost_krw,pnl_pct=cost_krw?pnl_krw/cost_krw*100:0;
    return{name:h.name,symbol:h.symbol,qty:h.qty,avg_price:h.avg_price,currency:h.currency,market:mkt,locked:h.locked||false,current_price:cur,value_krw,cost_krw,pnl_krw,pnl_pct,periods};
  }));
  const totalStockCost=resolved.reduce((s,h)=>s+h.cost_krw,0);
  const totalStockVal=resolved.reduce((s,h)=>s+h.value_krw,0);
  const totalPnl=totalStockVal-totalStockCost;
  const totalPnlPct=totalStockCost?totalPnl/totalStockCost*100:0;

  renderSummaryAndChart(totalStockVal,totalPnl,totalPnlPct,totalCashKrw,totalSavingsKrw);
  renderPortfolioUI(resolved);

  const rpw=document.getElementById('pf-realized-wrap');
  if(rpw&&pfJson?.realized_pnl_2025_krw){
    const rv=pfJson.realized_pnl_2025_krw,rc=cls(rv);
    rpw.innerHTML=`<div class="pf-realized">💹 2025년 실현손익: <span class="${rc}" style="font-size:13px">${rv>=0?'+':''}₩${Math.abs(rv).toLocaleString()}</span></div>`;
  }
}

function renderSummaryAndChart(stockKrw,pnlKrw,pnlPct,cashKrw,savingsKrw){
  const totalKrw=stockKrw+cashKrw+savingsKrw;
  const pc=cls(pnlKrw);
  document.getElementById('pf-summary').innerHTML=[
    {l:'총 자산',     v:'₩'+fmtMan(totalKrw),c:''},
    {l:'주식 평가액', v:'₩'+fmtMan(stockKrw),c:''},
    {l:'주식 손익',   v:(pnlKrw>=0?'+':'')+'₩'+fmtMan(Math.abs(pnlKrw)),c:pc},
    {l:'주식 수익률', v:(pnlPct>=0?'+':'')+pnlPct.toFixed(2)+'%',c:pc},
  ].map(x=>`<div class="pf-si"><div class="pf-sl">${x.l}</div><div class="pf-sv ${x.c}">${x.v}</div></div>`).join('');
  const wrap=document.getElementById('pf-chart-wrap');
  if(wrap){
    const assetData=[
      {n:`주식 (₩${fmtMan(stockKrw)})`,v:stockKrw,color:'#1d4ed8'},
      {n:`예적금 (₩${fmtMan(savingsKrw)})`,v:savingsKrw,color:'#059669'},
      {n:`현금 (₩${fmtMan(cashKrw)})`,v:cashKrw,color:'#0891b2'},
    ].filter(d=>d.v>0);
    drawDonutChartData(wrap,assetData,'자산배분');
  }
}

let acHideTimer=null;
function showAcList(idx,query,inputEl){
  clearTimeout(acHideTimer);
  let list=document.getElementById('ac-list-global');
  if(!list){list=document.createElement('div');list.id='ac-list-global';list.className='autocomplete-list';document.body.appendChild(list);}
  if(!query||query.length<1){list.style.display='none';return;}
  const q=query.toLowerCase();
  const matches=SYMBOL_DB.filter(s=>s.n.toLowerCase().includes(q)||s.s.toLowerCase().replace(/\.(ks|kq)$/,'').includes(q)).slice(0,9);
  if(!matches.length){list.style.display='none';return;}
  const rect=inputEl.getBoundingClientRect();
  list.style.cssText=`position:fixed;top:${rect.bottom+2}px;left:${rect.left}px;width:${Math.max(rect.width,220)}px;display:block;z-index:600`;
  list.innerHTML=matches.map(m=>`<div class="ac-item" data-idx="${idx}" data-n="${encodeURIComponent(m.n)}" data-s="${encodeURIComponent(m.s)}" data-m="${m.m}" onmousedown="selectAcItem(this)">
    <span>${m.n}</span><span class="ac-item-sym">${m.s} ${m.m==='KR'?'🇰🇷':'🇺🇸'}</span>
  </div>`).join('');
}
function selectAcItem(el){
  const idx=el.dataset.idx,name=decodeURIComponent(el.dataset.n),symbol=decodeURIComponent(el.dataset.s),market=el.dataset.m;
  const n=document.getElementById('pf-name-'+idx);
  const s=document.getElementById('pf-sym-'+idx);
  const m=document.getElementById('pf-mkt-'+idx);
  const c=document.getElementById('pf-cur-'+idx);
  if(n)n.value=name;if(s)s.value=symbol;if(m)m.value=market;if(c)c.value=market==='US'?'USD':'KRW';
  const list=document.getElementById('ac-list-global');
  if(list)list.style.display='none';
}
function hideAc(){
  acHideTimer=setTimeout(()=>{const list=document.getElementById('ac-list-global');if(list)list.style.display='none';},200);
}
document.addEventListener('click',e=>{const list=document.getElementById('ac-list-global');if(list&&!list.contains(e.target))list.style.display='none';});

function renderCash(items){
  const el=document.getElementById('pf-cash-list');if(!el)return;
  if(!items?.length){el.innerHTML='<div class="no-data">현금 데이터가 없습니다</div>';return;}
  const bankIcons={'신한은행':'🔵','토스뱅크':'🟢','우리은행':'🟣','카카오뱅크':'🟡','국민은행':'⭐'};
  let total=0;
  const rows=items.map(c=>{
    const amt=c.amount||0;
    if(c.currency==='KRW')total+=amt;
    const icon=bankIcons[c.bank]||'🏦';
    return `<div class="cash-item">
      <div class="cash-bank"><div class="cash-bank-icon">${icon}</div>${c.bank} <span style="font-size:10px;color:#aaa;font-weight:400">${c.currency}</span></div>
      <div class="cash-amt">₩${amt.toLocaleString()}</div>
    </div>`;
  }).join('');
  el.innerHTML=rows+`<div class="cash-total-row"><span>💰 합계</span><span style="color:#1d4ed8">₩${total.toLocaleString()}</span></div>`;
}

function renderSavings(items){
  const el=document.getElementById('pf-savings-list');if(!el)return;
  if(!items?.length){el.innerHTML='<div class="no-data">예적금 데이터가 없습니다</div>';return;}
  el.innerHTML=items.map(s=>{
    const today=new Date();
    const mat=new Date(s.maturity);
    const diff=Math.round((mat-today)/86400000);
    const dStr=diff>=0?`D-${diff.toLocaleString()}`:`D+${Math.abs(diff).toLocaleString()}`;
    const dColor=diff>365?'#16a34a':diff>90?'#d97706':'#dc2626';
    return `<div class="sav-card">
      <div class="sav-header">
        <span class="sav-type">${s.type||'예금'}</span>
        <span class="sav-bank">${s.bank}</span>
        <span class="sav-dday" style="background:${diff>365?'#f0fdf4':diff>90?'#fffbeb':'#fef2f2'};color:${dColor}">${dStr}</span>
      </div>
      <div class="sav-grid">
        <div class="sav-item"><div class="sl">만기일</div><div class="sv">${s.maturity}</div></div>
        <div class="sav-item"><div class="sl">이율</div><div class="sv sav-rate">${s.rate_pct}%</div></div>
        <div class="sav-item"><div class="sl">만기해지금액</div><div class="sv">₩${(s.maturity_amount||0).toLocaleString()}</div></div>
        <div class="sav-item"><div class="sl">통화</div><div class="sv">${s.currency||'KRW'}</div></div>
      </div>
    </div>`;
  }).join('');
}

function openPfEditor(){
  // 주식
  let stored=null;
  try{const s=localStorage.getItem('pf_holdings');if(s)stored=JSON.parse(s);}catch(e){}
  if(stored){pfEditData=stored;}
  else if(pfJson?.stocks?.length){pfEditData=pfJson.stocks.map(h=>({name:h.name,symbol:h.symbol,market:h.market||(h.symbol?.includes('.KS')||h.symbol?.includes('.KQ')?'KR':'US'),qty:h.qty,avg_price:h.avg_price,currency:h.currency||'KRW',locked:h.locked||false}));}
  else if(jsonData?.portfolio?.holdings){pfEditData=jsonData.portfolio.holdings.map(h=>({name:h.name,symbol:h.symbol,market:h.market||(h.symbol?.includes('.KS')||h.symbol?.includes('.KQ')?'KR':'US'),qty:h.qty,avg_price:h.avg_price,currency:h.currency||'KRW',locked:h.locked||false}));}
  else{pfEditData=[];}
  // 현금
  let storedCash=null;
  try{const s=localStorage.getItem('pf_cash');if(s)storedCash=JSON.parse(s);}catch(e){}
  pfCashEditData=storedCash||pfJson?.cash||[];
  // 예적금
  let storedSavings=null;
  try{const s=localStorage.getItem('pf_savings');if(s)storedSavings=JSON.parse(s);}catch(e){}
  pfSavingsEditData=storedSavings||pfJson?.savings||[];

  renderPfEditRows();
  renderCashEditRows();
  renderSavingsEditRows();
  // 항상 첫 탭(주식)으로 초기화
  document.querySelectorAll('.pfe-tab').forEach((b,i)=>b.classList.toggle('on',i===0));
  document.querySelectorAll('.pfe-content').forEach((c,i)=>c.classList.toggle('on',i===0));
  document.getElementById('pf-editor').classList.add('show');
  document.getElementById('pf-overlay').classList.add('show');
}
function closePfEditor(){
  document.getElementById('pf-editor').classList.remove('show');
  document.getElementById('pf-overlay').classList.remove('show');
}
function addPfRow(){collectPfEditData();pfEditData.push({name:'',symbol:'',market:'KR',qty:1,avg_price:0,currency:'KRW',locked:false});renderPfEditRows();}
function deletePfRow(i){collectPfEditData();pfEditData.splice(i,1);renderPfEditRows();}
async function savePfEditor(){
  collectPfEditData();
  collectCashEditData();
  collectSavingsEditData();
  // 주식
  const holdings=pfEditData.filter(h=>h.name&&h.symbol&&h.qty>0).map(h=>({...h,symbol:h.symbol.toUpperCase()}));
  localStorage.setItem('pf_holdings',JSON.stringify(holdings));
  // 현금
  const cash=pfCashEditData.filter(c=>c.bank&&c.amount>=0);
  localStorage.setItem('pf_cash',JSON.stringify(cash));
  // 예적금
  const savings=pfSavingsEditData.filter(s=>s.bank);
  localStorage.setItem('pf_savings',JSON.stringify(savings));
  closePfEditor();
  await renderPortfolio();
}
